name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies (Root)
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (Webviews)
        run: |
          cd webviews
          pnpm install --frozen-lockfile

      - name: Create VSIX Package
        run: pnpm run package

      - name: Get extension info
        id: info
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "filename=${NAME}-${VERSION}.vsix" >> $GITHUB_OUTPUT

      - name: Update Tag and Cleanup Release (Manual Trigger Only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Updating tag $TAG to point to the current commit..."
          git tag -f "$TAG"
          git push origin "$TAG" --force

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Deleting existing release $TAG to avoid body duplication..."
            gh release delete "$TAG" --yes
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.info.outputs.filename }}
          tag_name: ${{ steps.info.outputs.tag }}
          name: Release ${{ steps.info.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
